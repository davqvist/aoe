[entity-description]
aoc-cauldron=Benötigt 50 einer Flüssigkeit und 1 Gegenstand um ein Rezept zu brauen. Die Flüssigkeit muss zuerst hineingetan werden. Stehe innerhalb des Radiuses mit guter Brau-Ausrüstung, um eine höhere Brau-Erfolgswahrscheinlichkeit zu haben
aoc-fulgora-chest=Erlaubt Fernzugriff zum Frachtlandeplatz auf Fulgora, plazieren nur höchstens einmal pro Oberfläche erlaubt, nicht erlaubt auf Fulgora
aoc-gleba-chest=Erlaubt Fernzugriff zum Frachtlandeplatz auf Gleba, plazieren nur höchstens einmal pro Oberfläche erlaubt, nicht erlaubt auf Gleba
aoc-infusion-table=Verbraucht 10 MW im Betrieb, mit einem konstanten Verbrauch von 500kW
aoc-lightning-rod=Erzeugt eine große Menge Energie von Blitzeinschlägen über einen Zeitraum von 10s. Die Stärke des Einschlags kann mit Wetterstationen erhöht werden, das Intervall kann mit Sendestationen verringert werden
aoc-lunar-panel=Funktioniert nur in vollständiger Dunkelheit
aoc-nauvis-chest=Erlaubt Fernzugriff zum Frachtlandeplatz auf Nauvis, plazieren nur höchstens einmal pro Oberfläche erlaubt, nicht erlaubt auf Nauvis
aoc-nuclear-reactor=Muss auf Gebiet mit Stahlbeton mit Warnmarkierung plaziert werden, Mauern und Tore umgeben das Gebiet. Reaktor-Brennelemente und Kühlkörper müssen in dem Gebiet plaziert werden, um die Energie zu erhöhen und die Hitze auszugleichen. Falls die Hitze-Absorption nicht die Hitzegenerierung erreicht, schaltet der Reaktor ab. Prüfe die Reaktor-GUI und die Tooltips anderer Blöcke für weiterführende Information.
aoc-particle-accelerator=Fängt an zu funktionieren, wenn die Geschwindigkeit der Raumplattform mindestens 120 km/s ist
aoc-reactor-fuel-cell=Erhöht Treibstoffverbrauch, sowie Hitze- und Energieerzeugung. Hitze- und Energieerzeugung werden drastisch erhöht mit mehr angrenzenden Reaktor-Brennelementen
aoc-reactor-sink-aluminium=Hitze-Absorption: 120 - wenn angrenzend zu mindestens 1 Wasser Reaktor-Kühlkörper und 1 Mauer oder Tor
aoc-reactor-sink-aluminium-bronze=Hitze-Absorption: 160 - wenn angrenzend zu mindestens 1 Kupfer Reaktor-Kühlkörper und 1 Aluminium Reaktor-Kühlkörper
aoc-reactor-sink-apatite=Hitze-Absorption: 120 - wenn angrenzend zu mindestens 1 Mauer oder Tor und 1 Reaktor-Brennelement
aoc-reactor-sink-brass=Hitze-Absorption: 160 - wenn angrenzend zu mindestens 1 Kupfer Reaktor-Kühlkörper and 1 Zink Reaktor-Kühlkörper
aoc-reactor-sink-bronze=Hitze-Absorption: 155 - wenn angrenzend zu mindestens 1 Kupfer Reaktor-Kühlkörper und 1 Zinn Reaktor-Kühlkörper
aoc-reactor-sink-coolant=Hitze-Absorption: 160 - wenn angrenzend zu mindestens 3 Reaktor-Brennelementen
aoc-reactor-sink-copper=Hitze-Absorption: 40 - wenn angrenzend zu mindestens 1 Reaktor-Brennelement
aoc-reactor-sink-enderium=Hitze-Absorption: 100 - wenn angrenzend zu mindestens 3 Mauern oder Tore
aoc-reactor-sink-lead=Hitze-Absorption: 110 - wenn angrenzend zu mindestens 5 beliebigen Reaktor-Kühlkörpern
aoc-reactor-sink-quartz=Hitze-Absorption: 120 - wenn angrenzend zu mindestens 2 Wasser Reaktor-Kühlkörper
aoc-reactor-sink-tin=Hitze-Absorption: 90 - wenn angrenzend zu mindestens 3 anderen Zinn Reaktor-Kühlkörpern
aoc-reactor-sink-water=Hitze-Absorption: 60 - wenn angrenzend zu mindestens 1 Reaktor-Brennelement
aoc-reactor-sink-zinc=Hitze-Absorption: 80 - wenn angrenzend zu mindestens 1 anderen Zink Reaktor-Kühlkörper
aoc-replicator=Benötigt 1 [item=solid-fuel] und 100 einer Flüssigkeit um 200 derselben Flüssigkeit zu erzeugen oder 10 [fluid=aoc-liquid-antifuel] und 10 eines Gegenstandes um 20 desselben Gegenstandes zu erzeugen. Die Flüssigkeit muss zuerst hineingetan werden.
aoc-rtg-americium=Produziert passiv 1MW
aoc-rtg-californium=Produziert passiv 4MW
aoc-rtg-plutonium=Produziert passiv 2MW
aoc-rtg-uranium=Produziert passiv 0.5MW
aoc-transmitting-station=Wenn im Blitzableiter-Radius plaziert, reduziert das Blitzeinschlag-Intervall um circa 1.43s
aoc-vulcanus-chest=Erlaubt Fernzugriff zum Frachtlandeplatz auf Vulcanus, plazieren nur höchstens einmal pro Oberfläche erlaubt, nicht erlaubt auf Vulcanus
aoc-weather-station=Wenn im Blitzableiter-Radius plaziert, erhöht Blitzeinschlagstärke um 62.5MW
aoc-wind-turbine=Erzeugt im Durchschnitt 1MW Energie
